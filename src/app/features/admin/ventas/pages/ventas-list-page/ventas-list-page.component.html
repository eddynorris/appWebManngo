<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-content">
      <h1>Gestión de Ventas</h1>
      <p>Busca, crea y gestiona todas las ventas</p>
    </div>
    <div class="header-actions">
      <a routerLink="/admin/ventas/new" class="btn-primary">
        <fa-icon [icon]="faPlus"></fa-icon>
        Nueva Venta
      </a>
    </div>
  </div>

  <!-- Barra de acciones en lote -->
  @if (selectedVentas().length > 0) {
    <div class="batch-actions-bar animate-fade-in">
      <div class="batch-info">
        <span class="batch-count">{{ selectedVentas().length }}</span>
        <span class="batch-text">ventas seleccionadas</span>
      </div>
      <div class="batch-buttons">
        <button (click)="isBulkDeleteModalVisible.set(true)" class="btn-batch-delete">
          <fa-icon [icon]="faTrash"></fa-icon>
          Eliminar Seleccionadas
        </button>
      </div>
    </div>
  }

  <!-- Filtros Compartidos -->
  <app-table-filters
    [filters]="filterConfigs()"
    [initialValues]="currentFilterValues()"
    [clients]="clientes()"
    (filtersChange)="onFiltersChange($event)"
    (search)="onSearch($event)"
    (export)="onExport($event)"
    (clear)="onClearFilters()"
  ></app-table-filters>

  <!-- Reusable Data Table -->
  <app-data-table
    [data]="ventas()"
    [columns]="columns"
    [actions]="actions"
    [selectable]="true"
    (selectionChange)="handleSelectionChange($event)"
    (onAction)="handleTableAction($event)"
  ></app-data-table>

  <!-- Pagination -->
  @if (pagination()) {
    <app-pagination
      [pagination]="pagination()!"
      (pageChange)="onPageChange($event)"
      (perPageChange)="onPerPageChange($event)"
    ></app-pagination>
  }
</div>

@if (isModalVisible() && selectedVenta()) {
  <app-venta-detalle-modal
    [venta]="selectedVenta()!"
    [visible]="isModalVisible"
    (close)="handleCloseModal()"
  ></app-venta-detalle-modal>
}

@if (isDeleteModalVisible()) {
  <app-confirmation-modal
    [title]="'Confirmar Eliminación'"
    [message]="'¿Está seguro que desea eliminar esta venta? Esta acción no se puede deshacer.'"
    [confirmText]="'Eliminar Venta'"
    [cancelText]="'Cancelar'"
    (confirm)="handleDeleteConfirmation()"
    (cancel)="closeDeleteModal()"
  ></app-confirmation-modal>
}

@if (isBulkDeleteModalVisible()) {
  <app-confirmation-modal
    [title]="'Confirmar Eliminación en Lote'"
    [message]="'¿Está seguro que desea eliminar las ' + selectedVentas().length + ' ventas seleccionadas? Esta acción revertirá el stock de los productos e inventarios asociados y no se puede deshacer.'"
    [confirmText]="'Eliminar Ventas'"
    [cancelText]="'Cancelar'"
    (confirm)="handleBulkDeleteConfirmation()"
    (cancel)="closeBulkDeleteModal()"
  ></app-confirmation-modal>
}
